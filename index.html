<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zxaok — Link Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .left-column, .right-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        /* Профиль */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #252525;
            padding: 16px;
            border-radius: 12px;
            transition: 0.3s ease;
        }
        .profile-header:hover {
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffcc00;
            transition: 0.3s ease;
        }
        .avatar:hover {
            box-shadow: 0 0 15px #ffcc00;
        }
        .nickname {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }
        /* Большой блок репозиториев */
        .repos-box {
            background: #252525;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            transition: 0.3s ease;
        }
        .repos-box:hover {
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
        }
        .repos-box h3 {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 4px;
        }
        /* Кнопки и ссылки со свечением */
        .btn {
            display: block;
            background: #2c2c2c;
            color: #ffffff;
            text-align: center;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #3d3d3d;
        }
        .btn:hover {
            background: #ffcc00;
            color: #121212;
            border-color: #ffcc00;
            /* Эффект неонового свечения при наведении */
            box-shadow: 0 0 15px #ffcc00, 0 0 30px rgba(255, 204, 0, 0.5);
            transform: translateY(-2px);
        }
        /* Картинка телефона справа */
        .phone-banner {
            background: #252525;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
            transition: 0.3s ease;
        }
        .phone-banner:hover {
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }
        .phone-banner img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
        }
        .phone-banner p {
            font-size: 14px;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="left-column">
